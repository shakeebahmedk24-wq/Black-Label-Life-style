[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# API Chat endpoint to Netlify serverless function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

